<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- claims desk (static) -->
  <rect width="1200" height="300" fill="#14171c"/>
  <circle cx="140" cy="60" r="150" fill="#b91c1c" opacity="0.12"/>
  <circle cx="1070" cy="250" r="160" fill="#a7f3d0" opacity="0.06"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#eef2f0" opacity="0">
    Daman — Insurance
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#b91c1c" opacity="0">
    Mutual insurance &amp; parametric payouts · twelve contracts
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#9aa5a0" opacity="0">
    pricing · policies · claims · oracle triggers · reinsurance · surplus
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- desk panel -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="14" fill="#1e222a" stroke="#333842" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#eef2f0" opacity="0">
      Claims desk · live
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
      <rect x="20" y="60" width="420" height="30" rx="8" fill="#262b35"/>
      <text x="34" y="79" font-size="11" fill="#b91c1c" font-family="ui-monospace, Menlo, monospace">policy #0 · travel 10,000 · 30 days</text>
      <rect x="20" y="96" width="420" height="30" rx="8" fill="#262b35"/>
      <text x="34" y="115" font-size="11" fill="#eef2f0" font-family="ui-monospace, Menlo, monospace">claim 2,000 · 2-of-3 adjusters ✓ paid</text>
      <rect x="20" y="132" width="420" height="30" rx="8" fill="#262b35"/>
      <text x="34" y="151" font-size="11" fill="#9aa5a0" font-family="ui-monospace, Menlo, monospace">parametric: delay 240 &gt; 180 → auto 1,000</text>
    </g>

    <rect x="20" y="174" width="420" height="30" rx="8" fill="#262b35" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
    </rect>
    <text x="34" y="193" font-size="11" fill="#a7f3d0" opacity="0">
      🛡 reinsurance ceded 15% · surplus to no-claim members
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.5s"/>
    </text>
  </g>
</svg>
