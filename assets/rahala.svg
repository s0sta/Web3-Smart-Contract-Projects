<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#0e7c86"/>
    </linearGradient>
  </defs>

  <!-- payments console (static) -->
  <rect width="1200" height="300" fill="#f6f3ec"/>
  <circle cx="140" cy="60" r="150" fill="#0a2540" opacity="0.07"/>
  <circle cx="1070" cy="250" r="160" fill="#0e7c86" opacity="0.08"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#12263a" opacity="0">
    Rahala — Payments
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#0a2540" opacity="0">
    Cross-border payments &amp; remittances · twelve contracts
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#8a97a5" opacity="0">
    FX · escrow · invoice factoring · netting · arbitration · governance
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- console panel -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="14" fill="#fffdf8" stroke="#e4dcc8" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#12263a" opacity="0">
      Ledger · recent flows
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
      <rect x="20" y="60" width="420" height="30" rx="8" fill="#f0ebdd"/>
      <text x="34" y="79" font-size="11" fill="#0a2540" font-family="ui-monospace, Menlo, monospace">payment 10,000 → released 9,975 ✓</text>
      <rect x="20" y="96" width="420" height="30" rx="8" fill="#f0ebdd"/>
      <text x="34" y="115" font-size="11" fill="#0e7c86" font-family="ui-monospace, Menlo, monospace">FX 3,670 AED-S → 993 USD · 3.67</text>
      <rect x="20" y="132" width="420" height="30" rx="8" fill="#f0ebdd"/>
      <text x="34" y="151" font-size="11" fill="#8a97a5" font-family="ui-monospace, Menlo, monospace">invoice 10,000 factored at 9,700</text>
    </g>

    <rect x="20" y="174" width="420" height="30" rx="8" fill="#f0ebdd" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
    </rect>
    <text x="34" y="193" font-size="11" fill="#0a2540" opacity="0">
      🛫 batch netted 2,000 · arbiters 2-of-3 · KYC ✓
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.5s"/>
    </text>
  </g>
</svg>
