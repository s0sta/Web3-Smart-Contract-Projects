<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a53a"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- charcoal console (static) -->
  <rect width="1200" height="300" fill="#14161c"/>
  <circle cx="130" cy="70" r="150" fill="#3b82f6" opacity="0.08"/>
  <circle cx="1060" cy="240" r="150" fill="#f2a53a" opacity="0.06"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#f2a53a" opacity="0">
    VARA Treasury
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#eef0f5" opacity="0">
    Desert Exchange FZE · regulated VASP custody
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#8b91a1" opacity="0">
    segregated client assets · KYC tier limits · capital reserve · freeze &amp; drain
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- console panel -->
  <g transform="translate(700 44)">
    <rect width="460" height="212" rx="14" fill="#1c1f28" stroke="#2a2e3a" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
      <rect x="352" y="18" width="88" height="20" rx="999" fill="none" stroke="#3ecf8e" stroke-width="1.5"/>
      <text x="396" y="32" font-size="10" font-weight="700" fill="#3ecf8e" text-anchor="middle" letter-spacing="1">
        OPERATIONAL
      </text>
    </g>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#eef0f5" opacity="0">
      Reserve coverage
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.7s"/>
    </text>

    <!-- reserve bar -->
    <rect x="20" y="60" width="420" height="12" rx="6" fill="#2a2e3a" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.9s"/>
    </rect>
    <rect x="20" y="60" width="0" height="12" rx="6" fill="#3b82f6" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" fill="freeze" begin="2s"/>
      <animate attributeName="width" from="0" to="336" dur="1.6s" fill="freeze" begin="2s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <text x="20" y="90" font-size="10.5" font-weight="700" fill="#8b91a1" letter-spacing="1" opacity="0">
      HOUSE EQUITY VS LIABILITIES
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.1s"/>
    </text>
    <text x="440" y="90" font-size="10.5" fill="#eef0f5" text-anchor="end" font-family="ui-monospace, Menlo, monospace" opacity="0">
      120% · reserve 20%
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.1s"/>
    </text>

    <!-- ledger chips -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
      <rect x="20" y="112" width="200" height="32" rx="8" fill="#2a2e3a"/>
      <text x="34" y="132" font-size="10.5" fill="#f2a53a" font-family="ui-monospace, Menlo, monospace">client 25,000 AED-S ✓</text>
      <rect x="228" y="112" width="212" height="32" rx="8" fill="#2a2e3a"/>
      <text x="242" y="132" font-size="10.5" fill="#8b91a1" font-family="ui-monospace, Menlo, monospace">KYC Enhanced · limits ✓</text>
    </g>

    <rect x="20" y="156" width="420" height="34" rx="8" fill="#2a2e3a" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.7s"/>
    </rect>
    <text x="34" y="177" font-size="11" fill="#eef0f5" opacity="0">
      🛡 guardian drain armed · recovery 0x3198…B853
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.8s"/>
    </text>
  </g>
</svg>
