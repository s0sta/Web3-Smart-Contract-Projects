<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glowI" cx="0.12" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowS" cx="0.87" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#0a0f1e"/>
  <rect width="1200" height="300" fill="url(#glowI)"/>
  <rect width="1200" height="300" fill="url(#glowS)"/>

  <!-- key shards -->
  <g>
    <rect x="120" y="40" width="5" height="18" rx="2.5" fill="#38bdf8" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="6s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="y" values="40;14" dur="6s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="x" values="120;104" dur="6s" repeatCount="indefinite" begin="0s"/>
    </rect>
    <rect x="150" y="36" width="5" height="18" rx="2.5" fill="#6366f1" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite" begin="1.6s"/>
      <animate attributeName="y" values="36;10" dur="7s" repeatCount="indefinite" begin="1.6s"/>
      <animate attributeName="x" values="150;166" dur="7s" repeatCount="indefinite" begin="1.6s"/>
    </rect>
    <rect x="182" y="44" width="5" height="18" rx="2.5" fill="#38bdf8" opacity="0">
      <animate attributeName="opacity" values="0;0.75;0" dur="5.6s" repeatCount="indefinite" begin="2.9s"/>
      <animate attributeName="y" values="44;16" dur="5.6s" repeatCount="indefinite" begin="2.9s"/>
      <animate attributeName="x" values="182;176" dur="5.6s" repeatCount="indefinite" begin="2.9s"/>
    </rect>
  </g>

  <!-- vault shield -->
  <g transform="translate(96 84)">
    <path d="M36 0 L72 13 V44 C72 69 56 82 36 90 C16 82 0 69 0 44 V13 Z"
          fill="#101a33" stroke="url(#g1)" stroke-width="2.5"
          pathLength="360" stroke-dasharray="360" stroke-dashoffset="360">
      <animate attributeName="stroke-dashoffset" from="360" to="0" dur="1.8s" fill="freeze" begin="0.2s"/>
    </path>
    <circle cx="36" cy="42" r="9" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0 36 42" to="360 36 42" dur="14s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <path d="M28 24 l8 9 l10 -14" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
          pathLength="80" stroke-dasharray="80" stroke-dashoffset="80">
      <animate attributeName="stroke-dashoffset" from="80" to="0" dur="0.6s" fill="freeze" begin="2.1s"/>
    </path>
  </g>

  <!-- identity -->
  <text x="200" y="112" font-size="42" font-weight="700" fill="url(#g1)" opacity="0">
    MultiSig Vault
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="202" y="150" font-size="20" font-weight="600" fill="#e7ecf6" opacity="0">
    N-of-M Shared Treasury — from scratch
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="202" y="178" font-size="13.5" fill="#8e9ab4" opacity="0">
    Submit → confirm → execute. Nothing moves without N signatures — with failure-retry and full on-chain transparency.
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- threshold ring panel: 2-of-3 filling -->
  <g transform="translate(830 40)">
    <rect width="330" height="220" rx="16" fill="#0d1428" stroke="#22304f" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.4s"/>
    </rect>
    <circle cx="120" cy="105" r="56" fill="none" stroke="#2a3550" stroke-width="12" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.5s"/>
    </circle>
    <circle cx="120" cy="105" r="56" fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round"
            pathLength="352" stroke-dasharray="352" stroke-dashoffset="352"
            transform="rotate(-90 120 105)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" fill="freeze" begin="1.6s"/>
      <animate attributeName="stroke-dashoffset" from="352" to="117.33" dur="2.4s" fill="freeze" begin="1.6s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <text x="120" y="100" font-size="26" font-weight="700" fill="#e7ecf6" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" opacity="0">
      2/3
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.7s"/>
    </text>
    <text x="120" y="122" font-size="11" fill="#8e9ab4" text-anchor="middle" opacity="0">
      threshold met
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="4.2s"/>
    </text>
    <!-- owner dots -->
    <circle cx="222" cy="70" r="9" fill="#1b2440" stroke="#6366f1" stroke-width="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.8s"/>
    </circle>
    <path d="M218.5 70 l2.5 3 l5 -7" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="242" cy="112" r="9" fill="#1b2440" stroke="#6366f1" stroke-width="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.6s"/>
    </circle>
    <path d="M238.5 112 l2.5 3 l5 -7" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="222" cy="154" r="9" fill="#1b2440" stroke="#4b587a" stroke-width="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.4s"/>
    </circle>
    <text x="222" y="158" font-size="10" fill="#8e9ab4" text-anchor="middle">…</text>
    <!-- execute button -->
    <rect x="80" y="180" width="80" height="26" rx="13" fill="url(#g1)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="4.4s"/>
    </rect>
    <text x="120" y="197" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0">
      Execute
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="4.5s"/>
    </text>
  </g>

  <!-- sweep line -->
  <rect y="296" width="1200" height="2.5" fill="url(#g1)" opacity="0.55">
    <animate attributeName="y" values="296;0;296" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
