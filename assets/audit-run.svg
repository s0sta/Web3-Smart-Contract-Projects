<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="520" height="150" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="520" height="150" rx="14" fill="#0e1424" stroke="#22304f"/>

  <text x="20" y="28" font-size="14" fill="#e6eaf2" font-weight="600">audit run — security checklist</text>
  <circle cx="486" cy="23" r="4" fill="#10b981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- row template: label + track + fill + check -->
  <g font-size="12.5">
    <text x="20" y="52" fill="#aab4c6">Reentrancy &amp; CEI</text>
    <rect x="220" y="43" width="200" height="9" rx="4.5" fill="#1b2440"/>
    <rect x="220" y="43" width="0" height="9" rx="4.5" fill="url(#bar)">
      <animate attributeName="width" from="0" to="200" dur="1.1s" fill="freeze" begin="0.4s"/>
    </rect>
    <path d="M446 43 l6 6 l10 -12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          pathLength="40" stroke-dasharray="40" stroke-dashoffset="40">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="0.35s" fill="freeze" begin="1.5s"/>
    </path>

    <text x="20" y="80" fill="#aab4c6">Access control matrix</text>
    <rect x="220" y="71" width="200" height="9" rx="4.5" fill="#1b2440"/>
    <rect x="220" y="71" width="0" height="9" rx="4.5" fill="url(#bar)">
      <animate attributeName="width" from="0" to="200" dur="1.1s" fill="freeze" begin="1.7s"/>
    </rect>
    <path d="M446 71 l6 6 l10 -12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          pathLength="40" stroke-dasharray="40" stroke-dashoffset="40">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="0.35s" fill="freeze" begin="2.8s"/>
    </path>

    <text x="20" y="108" fill="#aab4c6">Rounding &amp; overflow</text>
    <rect x="220" y="99" width="200" height="9" rx="4.5" fill="#1b2440"/>
    <rect x="220" y="99" width="0" height="9" rx="4.5" fill="url(#bar)">
      <animate attributeName="width" from="0" to="200" dur="1.1s" fill="freeze" begin="3s"/>
    </rect>
    <path d="M446 99 l6 6 l10 -12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          pathLength="40" stroke-dasharray="40" stroke-dashoffset="40">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="0.35s" fill="freeze" begin="4.1s"/>
    </path>

    <text x="20" y="136" fill="#aab4c6">Fuzz: 256 runs / test</text>
    <rect x="220" y="127" width="200" height="9" rx="4.5" fill="#1b2440"/>
    <rect x="220" y="127" width="0" height="9" rx="4.5" fill="url(#bar)">
      <animate attributeName="width" from="0" to="200" dur="1.1s" fill="freeze" begin="4.3s"/>
    </rect>
    <path d="M446 127 l6 6 l10 -12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          pathLength="40" stroke-dasharray="40" stroke-dashoffset="40">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="0.35s" fill="freeze" begin="5.4s"/>
    </path>
  </g>
</svg>
