<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.14" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.86" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#120a16"/>
  <rect width="1200" height="300" fill="url(#glowP)"/>
  <rect width="1200" height="300" fill="url(#glowL)"/>

  <!-- twinkles -->
  <circle cx="120" cy="60" r="2.5" fill="#a3e635" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.6s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="180" cy="130" r="2" fill="#ec4899" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="4.4s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="90" cy="190" r="2.2" fill="#a3e635" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- identity -->
  <text x="230" y="110" font-size="42" font-weight="700" fill="url(#g1)" opacity="0">
    Genesis Collection
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="232" y="148" font-size="20" font-weight="600" fill="#f6eef8" opacity="0">
    ERC-721 from scratch · Merkle whitelist · royalties · reveal
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="232" y="176" font-size="13.5" fill="#a892b0" opacity="0">
    5000 supply · 0.05 ETH whitelist / 0.08 ETH public · ERC-2981 · pre-reveal lock until the owner reveals
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- gallery tiles -->
  <g transform="translate(700 52)">
    <!-- tile 1: mystery (locked) -->
    <rect x="0" y="0" width="88" height="88" rx="12" fill="#180d1e" stroke="#3a2038" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>
    <text x="44" y="52" font-size="30" text-anchor="middle" fill="#a892b0" opacity="0">
      🔒
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.6s"/>
    </text>
    <text x="44" y="78" font-size="11" text-anchor="middle" fill="#a892b0" font-family="ui-monospace, Menlo, monospace">#0</text>

    <!-- tile 2: holographic mint -->
    <rect x="100" y="0" width="88" height="88" rx="12" fill="url(#g1)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.2s"/>
      <animateTransform attributeName="transform" type="rotate" from="0 144 44" to="360 144 44" dur="9s" repeatCount="indefinite" begin="2.2s" additive="sum"/>
    </rect>
    <text x="144" y="52" font-size="26" font-weight="700" text-anchor="middle" fill="#1a0812">✦</text>
    <text x="144" y="78" font-size="11" text-anchor="middle" fill="#1a0812" font-family="ui-monospace, Menlo, monospace" font-weight="700">#1</text>

    <!-- tile 3: minting in -->
    <rect x="200" y="0" width="88" height="88" rx="12" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-dasharray="10 8" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="3s"/>
      <animate attributeName="stroke-dashoffset" from="18" to="0" dur="1s" repeatCount="indefinite" begin="3s"/>
    </rect>
    <text x="244" y="52" font-size="26" text-anchor="middle" fill="#f6eef8" opacity="0">
      ?
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.2s"/>
    </text>
    <text x="244" y="78" font-size="11" text-anchor="middle" fill="#a892b0" font-family="ui-monospace, Menlo, monospace">#2</text>

    <!-- sparkle burst on tile 2 -->
    <circle cx="130" cy="10" r="2.5" fill="#f6eef8" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite" begin="4.6s"/>
      <animate attributeName="cy" values="10;-4" dur="1.2s" repeatCount="indefinite" begin="4.6s"/>
    </circle>
    <circle cx="158" cy="8" r="2" fill="#f6eef8" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite" begin="5s"/>
      <animate attributeName="cy" values="8;-6" dur="1.4s" repeatCount="indefinite" begin="5s"/>
    </circle>

    <!-- progress: 3 / 5000 -->
    <rect x="0" y="104" width="288" height="12" rx="6" fill="#2a1530" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.5s"/>
    </rect>
    <rect x="0" y="104" width="0" height="12" rx="6" fill="url(#g1)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" fill="freeze" begin="1.6s"/>
      <animate attributeName="width" from="0" to="17.28" dur="2.6s" fill="freeze" begin="1.6s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <text x="288" y="114" font-size="12" text-anchor="end" fill="#a3e635" font-family="ui-monospace, Menlo, monospace" opacity="0">
      3 / 5000
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.7s"/>
    </text>
  </g>

  <!-- sweep line -->
  <rect y="296" width="1200" height="2.5" fill="url(#g1)" opacity="0.55">
    <animate attributeName="y" values="296;0;296" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
