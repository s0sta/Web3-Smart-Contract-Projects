<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0d151c"/>
  <circle cx="150" cy="58" r="155" fill="#14b8a6" opacity="0.13"/>
  <circle cx="1060" cy="252" r="160" fill="#fb7185" opacity="0.09"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#e8f1f2" opacity="0">
    Shifa — Healthcare
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#14b8a6" opacity="0">
    The patient owns the file · twelve contracts
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#90a4ad" opacity="0">
    records · consent · e-prescriptions · visits · health cover · break-glass
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- care console -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="14" fill="#131f28" stroke="#22323d" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#e8f1f2" opacity="0">
      Patient file · consent-gated
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
      <rect x="20" y="60" width="420" height="30" rx="8" fill="#1b2a34"/>
      <text x="34" y="79" font-size="11" fill="#14b8a6" font-family="ui-monospace, Menlo, monospace">consent: doctor · records + prescriptions · 90 days</text>
      <rect x="20" y="96" width="420" height="30" rx="8" fill="#1b2a34"/>
      <text x="34" y="115" font-size="11" fill="#e8f1f2" font-family="ui-monospace, Menlo, monospace">record #0 filed · prescription #0 dispensed (1 refill)</text>
      <rect x="20" y="132" width="420" height="30" rx="8" fill="#1b2a34"/>
      <text x="34" y="151" font-size="11" fill="#90a4ad" font-family="ui-monospace, Menlo, monospace">claim: insurer 800 SAR · patient copay 200 SAR</text>
    </g>

    <rect x="20" y="174" width="420" height="30" rx="8" fill="#1b2a34" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
    </rect>
    <text x="34" y="193" font-size="11" fill="#fb7185" opacity="0">
      ⚕ break-glass ≤ 72h, always reviewed · 2-of-3 medical panel · timelocked governance
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.5s"/>
    </text>
  </g>
</svg>
