<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <!-- identity wallet (static) -->
  <rect width="1200" height="300" fill="#fafafc"/>
  <circle cx="140" cy="60" r="150" fill="#4338ca" opacity="0.07"/>
  <circle cx="1070" cy="250" r="160" fill="#a5b4fc" opacity="0.14"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#1e1b33" opacity="0">
    Huwiyya — Identity
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#4338ca" opacity="0">
    Decentralized identity &amp; credentials · ten contracts
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#8b87a8" opacity="0">
    DIDs · selective disclosure · attestations · reputation · social recovery
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- credential panel -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="14" fill="#ffffff" stroke="#e3e1f2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#1e1b33" opacity="0">
      IdentityCard · presented with a proof
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
      <rect x="20" y="60" width="420" height="30" rx="8" fill="#f1f1f8"/>
      <text x="34" y="79" font-size="11" fill="#4338ca" font-family="ui-monospace, Menlo, monospace">name · nationality ███ (hidden)</text>
      <rect x="20" y="96" width="420" height="30" rx="8" fill="#f1f1f8"/>
      <text x="34" y="115" font-size="11" fill="#1e1b33" font-family="ui-monospace, Menlo, monospace">dob ≥ 1990 ✓ merkle proof verified</text>
      <rect x="20" y="132" width="420" height="30" rx="8" fill="#f1f1f8"/>
      <text x="34" y="151" font-size="11" fill="#8b87a8" font-family="ui-monospace, Menlo, monospace">reputation 400 · attestor-weighted</text>
    </g>

    <rect x="20" y="174" width="420" height="30" rx="8" fill="#f1f1f8" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
    </rect>
    <text x="34" y="193" font-size="11" fill="#4338ca" opacity="0">
      🪪 gate granted · recovery 2-of-3 guardians
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.5s"/>
    </text>
  </g>
</svg>
