<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65a30d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- energy grid (static) -->
  <rect width="1200" height="300" fill="#101418"/>
  <circle cx="140" cy="60" r="150" fill="#65a30d" opacity="0.12"/>
  <circle cx="1070" cy="250" r="160" fill="#f59e0b" opacity="0.08"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#eef2e8" opacity="0">
    Taqa — Energy
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#65a30d" opacity="0">
    Renewable energy &amp; carbon markets · twelve contracts
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#9aa78f" opacity="0">
    RECs · carbon credits · P2P trading · green-claim retirement
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- grid panel -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="14" fill="#1a1f24" stroke="#2c333b" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#eef2e8" opacity="0">
      Meter #0 · 25 kW solar
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
      <rect x="20" y="60" width="420" height="30" rx="8" fill="#22282e"/>
      <text x="34" y="79" font-size="11" fill="#65a30d" font-family="ui-monospace, Menlo, monospace">10,000 kWh attested → 10 RECs minted</text>
      <rect x="20" y="96" width="420" height="30" rx="8" fill="#22282e"/>
      <text x="34" y="115" font-size="11" fill="#eef2e8" font-family="ui-monospace, Menlo, monospace">2 RECs traded · 1 retired for a green claim</text>
      <rect x="20" y="132" width="420" height="30" rx="8" fill="#22282e"/>
      <text x="34" y="151" font-size="11" fill="#9aa78f" font-family="ui-monospace, Menlo, monospace">P2P: 100 kWh @ 0.5 AED/kWh ✓</text>
    </g>

    <rect x="20" y="174" width="420" height="30" rx="8" fill="#22282e" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
    </rect>
    <text x="34" y="193" font-size="11" fill="#f59e0b" opacity="0">
      ⚡ double-retirement proof · zone-compliant · certificate-weighted votes
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.5s"/>
    </text>
  </g>
</svg>
