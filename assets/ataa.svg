<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d6e4f"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>

  <!-- giving hub (static) -->
  <rect width="1200" height="300" fill="#f7f4ec"/>
  <circle cx="140" cy="60" r="150" fill="#0d6e4f" opacity="0.08"/>
  <circle cx="1070" cy="250" r="160" fill="#c9a227" opacity="0.10"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#1c2a23" opacity="0">
    Ataa — Giving
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#0d6e4f" opacity="0">
    Zakat, sadaqa &amp; donor tracking · ten contracts
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#8b958c" opacity="0">
    7 asset classes · nisab &amp; hawl · provenance · campaigns · sponsorships
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- console panel -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="14" fill="#fffdf6" stroke="#e4dcc4" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#1c2a23" opacity="0">
      My giving · tracked
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
      <rect x="20" y="60" width="420" height="30" rx="8" fill="#f2ecdb"/>
      <text x="34" y="79" font-size="11" fill="#0d6e4f" font-family="ui-monospace, Menlo, monospace">zakat 2,500 ✓ 2.5% after 354 days</text>
      <rect x="20" y="96" width="420" height="30" rx="8" fill="#f2ecdb"/>
      <text x="34" y="115" font-size="11" fill="#1c2a23" font-family="ui-monospace, Menlo, monospace">sadaqa 5,000 ✓ tracked</text>
      <rect x="20" y="132" width="420" height="30" rx="8" fill="#f2ecdb"/>
      <text x="34" y="151" font-size="11" fill="#c9a227" font-family="ui-monospace, Menlo, monospace">3,000 → beneficiary #0 (orphan support)</text>
    </g>

    <rect x="20" y="174" width="420" height="30" rx="8" fill="#f2ecdb" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
    </rect>
    <text x="34" y="193" font-size="11" fill="#0d6e4f" opacity="0">
      🤲 sponsorship 200/mo · committee 2-of-3 · donor governance
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.5s"/>
    </text>
  </g>
</svg>
