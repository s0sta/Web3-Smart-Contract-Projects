<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d4f5a"/>
      <stop offset="1" stop-color="#c77b4f"/>
    </linearGradient>
  </defs>

  <!-- petroleum floor (static) -->
  <rect width="1200" height="300" fill="#f4f7f6"/>
  <circle cx="140" cy="60" r="150" fill="#0d4f5a" opacity="0.07"/>
  <circle cx="1070" cy="250" r="160" fill="#c77b4f" opacity="0.08"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#1d2a28" opacity="0">
    Mawarid — RWA Platform
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#0d4f5a" opacity="0">
    End-to-end tokenized real estate · nine contracts
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#7d8f8b" opacity="0">
    primary issuance · OTC exchange · rental epochs · governance · treasury · insurance
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- exchange panel -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="14" fill="#ffffff" stroke="#d8e4e1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#1d2a28" opacity="0">
      Order book — Marina Gate Shares
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    </text>

    <!-- order rows -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
      <rect x="20" y="60" width="420" height="30" rx="8" fill="#f0f5f4"/>
      <text x="34" y="79" font-size="11" fill="#0d4f5a" font-family="ui-monospace, Menlo, monospace">#2 · 100 @ 110 · fill</text>
      <rect x="20" y="96" width="420" height="30" rx="8" fill="#f0f5f4"/>
      <text x="34" y="115" font-size="11" fill="#7d8f8b" font-family="ui-monospace, Menlo, monospace">#1 · 250 @ 112 · canceled</text>
      <rect x="20" y="132" width="420" height="30" rx="8" fill="#f0f5f4"/>
      <text x="34" y="151" font-size="11" fill="#c77b4f" font-family="ui-monospace, Menlo, monospace">fee 1% → treasury · volume 350</text>
    </g>

    <!-- epoch chip -->
    <rect x="20" y="174" width="420" height="30" rx="8" fill="#f0f5f4" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
    </rect>
    <text x="34" y="193" font-size="11" fill="#1d2a28" opacity="0">
      🏛 governance · rental epoch #3 · 9 AED-S / share
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.5s"/>
    </text>
  </g>
</svg>
