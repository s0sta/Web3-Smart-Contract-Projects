<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e1423"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>

  <!-- champagne hall (static) -->
  <rect width="1200" height="300" fill="#faf5f0"/>
  <circle cx="140" cy="60" r="150" fill="#6e1423" opacity="0.07"/>
  <circle cx="1070" cy="250" r="160" fill="#c9a227" opacity="0.09"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#2b1d1d" opacity="0">
    Tamweel — Credit Protocol
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#6e1423" opacity="0">
    A complete digital bank on-chain · ten contracts
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#9a8580" opacity="0">
    deposits · utilization rates · collateralized credit · loans · auctions · insurance
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- banking panel -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="14" fill="#fffdfa" stroke="#e8dcc9" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#2b1d1d" opacity="0">
      Utilization · live rates
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    </text>

    <!-- utilization bar -->
    <rect x="20" y="60" width="420" height="14" rx="7" fill="#f0e6d5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.8s"/>
    </rect>
    <rect x="20" y="60" width="0" height="14" rx="7" fill="#6e1423" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" fill="freeze" begin="1.9s"/>
      <animate attributeName="width" from="0" to="235" dur="1.6s" fill="freeze" begin="1.9s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <text x="20" y="92" font-size="10.5" font-weight="700" fill="#9a8580" letter-spacing="1" opacity="0">
      BORROWED 56% · BELOW THE 80% KINK
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2s"/>
    </text>
    <text x="440" y="92" font-size="10.5" fill="#2b1d1d" text-anchor="end" font-family="ui-monospace, Menlo, monospace" opacity="0">
      4.2% APR
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2s"/>
    </text>

    <!-- ledger rows -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
      <rect x="20" y="110" width="420" height="32" rx="8" fill="#f0e6d5"/>
      <text x="34" y="130" font-size="11" fill="#6e1423" font-family="ui-monospace, Menlo, monospace">deposit 250,000 ✓ vault shares</text>
      <rect x="20" y="150" width="420" height="32" rx="8" fill="#f0e6d5"/>
      <text x="34" y="170" font-size="11" fill="#2b1d1d" font-family="ui-monospace, Menlo, monospace">borrow 14,000 · health 1.14 ✓</text>
    </g>

    <rect x="20" y="188" width="420" height="26" rx="8" fill="#f0e6d5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.9s"/>
    </rect>
    <text x="34" y="205" font-size="11" fill="#c9a227" opacity="0">
      🏛 depositor governance · late fees → charity
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="3s"/>
    </text>
  </g>
</svg>
