<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glowF" cx="0.14" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.86" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#140b14"/>
  <rect width="1200" height="300" fill="url(#glowF)"/>
  <rect width="1200" height="300" fill="url(#glowO)"/>

  <!-- converging agreement sparks -->
  <circle r="6" fill="#d946ef" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.46;0.54" dur="8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="cx" values="60;520" dur="8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="cy" values="70;70" dur="8s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="6" fill="#f97316" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.46;0.54" dur="8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="cx" values="980;520" dur="8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="cy" values="70;70" dur="8s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="520" cy="70" r="10" fill="none" stroke="#d946ef" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0" keyTimes="0;0.53;0.56;0.62" dur="8s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="r" values="4;26" keyTimes="0;1" dur="0.8s" repeatCount="indefinite" begin="4.48s"/>
  </circle>

  <!-- identity -->
  <text x="90" y="140" font-size="42" font-weight="700" fill="url(#g1)" opacity="0">
    TrustEscrow
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="92" y="178" font-size="20" font-weight="600" fill="#f5eef5" opacity="0">
    Buyer / Seller Escrow with Arbitration
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="92" y="206" font-size="13.5" fill="#a891a9" opacity="0">
    Lock ETH → release on delivery, refund, or let a neutral arbiter split the funds. Fees only on completed deals.
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- lifecycle panel -->
  <g transform="translate(640 40)">
    <rect width="520" height="220" rx="16" fill="#1b0f1c" stroke="#3a1f3d" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.4s"/>
    </rect>
    <text x="24" y="34" font-size="12.5" fill="#a891a9" font-family="ui-monospace, Menlo, monospace" opacity="0">
      deal #0 — 1.0000 ETH · frozen fee 0.5%
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.6s"/>
    </text>

    <!-- step 1 open (done) -->
    <circle cx="60" cy="90" r="11" fill="url(#g1)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.8s"/>
    </circle>
    <path d="M55.5 90 l3.5 3.5 l7 -8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="120" font-size="11.5" fill="#f5eef5" text-anchor="middle" opacity="0">
      open
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.9s"/>
    </text>
    <line x1="80" y1="90" x2="200" y2="90" stroke="url(#g1)" stroke-width="3" stroke-dasharray="8 6" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2s"/>
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.8s" repeatCount="indefinite" begin="2s"/>
    </line>

    <!-- step 2 dispute (now) -->
    <circle cx="240" cy="90" r="11" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.6s"/>
      <animate attributeName="r" values="11;15;11" dur="1.6s" repeatCount="indefinite" begin="2.6s"/>
    </circle>
    <text x="240" y="120" font-size="11.5" fill="#fbbf24" text-anchor="middle" font-weight="700" opacity="0">
      disputed
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.7s"/>
    </text>
    <line x1="260" y1="90" x2="380" y2="90" stroke="#4a2a4d" stroke-width="3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.8s"/>
    </line>

    <!-- step 3 resolved (pending) -->
    <circle cx="420" cy="90" r="11" fill="none" stroke="#a891a9" stroke-width="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3s"/>
    </circle>
    <text x="420" y="120" font-size="11.5" fill="#a891a9" text-anchor="middle" opacity="0">
      resolved
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.1s"/>
    </text>

    <!-- arbiter split bar -->
    <rect x="24" y="146" width="200" height="10" rx="5" fill="#d946ef" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.4s"/>
    </rect>
    <text x="124" y="138" font-size="11" fill="#f0abfc" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" opacity="0">
      buyer 0.4
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.5s"/>
    </text>
    <rect x="230" y="146" width="254" height="10" rx="5" fill="#f97316" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.8s"/>
    </rect>
    <text x="357" y="138" font-size="11" fill="#fdba74" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" opacity="0">
      seller 0.595 · fee 0.005
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.9s"/>
    </text>

    <!-- stamp -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" fill="freeze" begin="4.6s"/>
      <rect x="396" y="170" width="88" height="30" rx="6" fill="none" stroke="#34d399" stroke-width="2.5" transform="rotate(-6 440 185)">
        <animateTransform attributeName="transform" type="scale" values="2.2;1" dur="0.4s" additive="sum" begin="4.6s" fill="freeze"/>
      </rect>
      <text x="440" y="190" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="2" transform="rotate(-6 440 185)">RESOLVED</text>
    </g>
  </g>

  <!-- sweep line -->
  <rect y="296" width="1200" height="2.5" fill="url(#g1)" opacity="0.55">
    <animate attributeName="y" values="296;0;296" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
