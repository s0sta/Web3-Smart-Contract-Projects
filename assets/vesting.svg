<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.18" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowI" cx="0.85" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#0b0e14"/>
  <rect width="1200" height="300" fill="url(#glowR)"/>
  <rect width="1200" height="300" fill="url(#glowI)"/>

  <!-- falling sands -->
  <rect x="120" y="-10" width="3" height="10" rx="1.5" fill="#fb7185" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="y" values="-10;300" dur="7s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <rect x="160" y="-10" width="3" height="10" rx="1.5" fill="#e2e8f0" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="8.4s" repeatCount="indefinite" begin="1.8s"/>
    <animate attributeName="y" values="-10;300" dur="8.4s" repeatCount="indefinite" begin="1.8s"/>
  </rect>
  <rect x="200" y="-10" width="3" height="10" rx="1.5" fill="#fb7185" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="6.2s" repeatCount="indefinite" begin="3.4s"/>
    <animate attributeName="y" values="-10;300" dur="6.2s" repeatCount="indefinite" begin="3.4s"/>
  </rect>

  <!-- identity -->
  <text x="250" y="112" font-size="42" font-weight="700" fill="url(#g1)" opacity="0">
    TokenVesting
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="252" y="150" font-size="20" font-weight="600" fill="#eef2f8" opacity="0">
    Cliff + linear, from scratch
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="252" y="178" font-size="13.5" fill="#93a1b8" opacity="0">
    Funded schedules · beneficiaries claim what's vested · owners revoke the unvested remainder
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- vesting donut panel -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="16" fill="#10141d" stroke="#232a3a" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.4s"/>
    </rect>
    <circle cx="105" cy="110" r="70" fill="none" stroke="#232a3a" stroke-width="11" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.5s"/>
    </circle>
    <circle cx="105" cy="110" r="70" fill="none" stroke="url(#g1)" stroke-width="11" stroke-linecap="round"
            pathLength="439.8" stroke-dasharray="439.8" stroke-dashoffset="439.8"
            transform="rotate(-90 105 110)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" fill="freeze" begin="1.6s"/>
      <animate attributeName="stroke-dashoffset" from="439.8" to="161.26" dur="2.6s" fill="freeze" begin="1.6s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <text x="105" y="104" font-size="26" font-weight="700" fill="#fb7185" text-anchor="middle" opacity="0">
      63.3%
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
    </text>
    <text x="105" y="126" font-size="10.5" fill="#93a1b8" text-anchor="middle" opacity="0">
      fully vested in 152d
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="4.4s"/>
    </text>

    <!-- chips -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="4.6s"/>
      <rect x="200" y="40" width="108" height="40" rx="10" fill="#161b27" stroke="#232a3a"/>
      <text x="210" y="54" font-size="8.5" fill="#93a1b8" font-weight="700" letter-spacing="1">START</text>
      <text x="210" y="70" font-size="11.5" fill="#eef2f8" font-family="ui-monospace, Menlo, monospace">Jan 3 '26</text>
      <rect x="318" y="40" width="108" height="40" rx="10" fill="#161b27" stroke="#232a3a"/>
      <text x="328" y="54" font-size="8.5" fill="#93a1b8" font-weight="700" letter-spacing="1">CLIFF</text>
      <text x="328" y="70" font-size="11.5" fill="#eef2f8" font-family="ui-monospace, Menlo, monospace">passed ✓</text>
      <rect x="200" y="92" width="108" height="40" rx="10" fill="#161b27" stroke="#232a3a"/>
      <text x="210" y="106" font-size="8.5" fill="#93a1b8" font-weight="700" letter-spacing="1">END</text>
      <text x="210" y="122" font-size="11.5" fill="#eef2f8" font-family="ui-monospace, Menlo, monospace">Aug 4 '29</text>
      <rect x="318" y="92" width="108" height="40" rx="10" fill="#161b27" stroke="#232a3a"/>
      <text x="328" y="106" font-size="8.5" fill="#93a1b8" font-weight="700" letter-spacing="1">STATUS</text>
      <text x="328" y="122" font-size="11.5" fill="#34d399" font-family="ui-monospace, Menlo, monospace">active</text>
    </g>

    <!-- claim button -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="5s"/>
      <circle cx="259" cy="178" r="26" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.5">
        <animate attributeName="r" values="22;32" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <rect x="235" y="164" width="48" height="26" rx="13" fill="url(#g1)"/>
      <text x="259" y="181" font-size="11.5" font-weight="700" fill="#1a0d10" text-anchor="middle">Claim</text>
    </g>
  </g>

  <!-- sweep line -->
  <rect y="296" width="1200" height="2.5" fill="url(#g1)" opacity="0.55">
    <animate attributeName="y" values="296;0;296" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
