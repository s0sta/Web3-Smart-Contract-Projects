<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gTerm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c31"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.12" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.88" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="#0b0f1a"/>
  <rect width="1200" height="300" fill="url(#glowV)"/>
  <rect width="1200" height="300" fill="url(#glowC)"/>

  <!-- subtle grid -->
  <g stroke="#8b96ab" stroke-opacity="0.05" stroke-width="1">
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300"/>
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200"/>
  </g>

  <!-- floating particles -->
  <circle cx="150" cy="230" r="2.4" fill="#7c3aed">
    <animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="cy" values="230;200;230" dur="5s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="330" cy="60" r="2" fill="#06b6d4">
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite" begin="1.2s"/>
    <animate attributeName="cy" values="60;88;60" dur="6s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="470" cy="250" r="1.8" fill="#8b96ab">
    <animate attributeName="opacity" values="0;0.6;0" dur="7s" repeatCount="indefinite" begin="2.1s"/>
    <animate attributeName="cy" values="250;222;250" dur="7s" repeatCount="indefinite" begin="2.1s"/>
  </circle>
  <circle cx="1010" cy="270" r="2.2" fill="#7c3aed">
    <animate attributeName="opacity" values="0;0.8;0" dur="5.5s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="cy" values="270;244;270" dur="5.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="1120" cy="80" r="1.9" fill="#06b6d4">
    <animate attributeName="opacity" values="0;0.7;0" dur="6.5s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="cy" values="80;104;80" dur="6.5s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- shield + drawn checkmark -->
  <g transform="translate(48 36)">
    <path d="M28 0 L56 10 V34 C56 54 44 64 28 70 C12 64 0 54 0 34 V10 Z"
          fill="#101a30" stroke="url(#g1)" stroke-width="2.5"
          pathLength="300" stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="1.6s" fill="freeze" begin="0.2s"/>
    </path>
    <path d="M16 37 L26 47 L42 27" fill="none" stroke="#10b981" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"
          pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.6s" fill="freeze" begin="2.1s"/>
    </path>
    <circle cx="28" cy="35" r="34" fill="none" stroke="#10b981" stroke-width="1.5">
      <animate attributeName="r" values="30;48" dur="2.6s" repeatCount="indefinite" begin="2.1s"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
  </g>

  <!-- identity -->
  <text x="120" y="80" font-size="42" font-weight="700" fill="url(#g1)" opacity="0">
    s0sta
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="122" y="120" font-size="22" font-weight="600" fill="#e6eaf2" opacity="0">
    Web3 Security Researcher
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="122" y="149" font-size="18" font-weight="500" fill="#aab4c6" opacity="0">
    Smart Contract Auditor · Solidity Developer
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>
  <text x="122" y="178" font-size="13.5" fill="#8b96ab" opacity="0">
    I build DeFi-grade contracts from scratch — and I test them like an attacker.
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.3s"/>
  </text>

  <!-- badges -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.7s"/>
    <g>
      <rect x="122" y="196" width="118" height="26" rx="13" fill="#1b2440" stroke="#3b4a75"/>
      <text x="181" y="213" font-size="12" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, Menlo, monospace">Solidity 0.8.26</text>
    </g>
    <g>
      <rect x="250" y="196" width="92" height="26" rx="13" fill="#1b2440" stroke="#3b4a75"/>
      <text x="296" y="213" font-size="12" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, Menlo, monospace">Foundry</text>
    </g>
    <g>
      <rect x="352" y="196" width="104" height="26" rx="13" fill="#1b2440" stroke="#3b4a75"/>
      <text x="404" y="213" font-size="12" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, Menlo, monospace">567 tests ✓</text>
    </g>
    <g>
      <rect x="466" y="196" width="110" height="26" rx="13" fill="#1b2440" stroke="#3b4a75"/>
      <text x="521" y="213" font-size="12" text-anchor="middle" fill="#fcd34d" font-family="ui-monospace, Menlo, monospace">20 dApps live</text>
    </g>
  </g>

  <!-- audit terminal -->
  <g transform="translate(610 36)">
    <rect width="550" height="228" rx="14" fill="url(#gTerm)" stroke="#2a3550" stroke-width="1"/>
    <circle cx="26" cy="22" r="5" fill="#f43f5e"/>
    <circle cx="44" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="62" cy="22" r="5" fill="#10b981"/>
    <text x="92" y="26" font-size="12" fill="#8b96ab" font-family="ui-monospace, Menlo, monospace">s0sta@audit: ~/web3-smart-contract-projects</text>

    <!-- running bash command -->
    <text x="26" y="66" font-size="15" fill="#8b96ab" font-family="ui-monospace, Menlo, monospace" opacity="0">
      $ forge test --summary
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="0.9s"/>
    </text>
    <rect x="212" y="54" width="9" height="15" fill="#06b6d4" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.55;0.55;1" dur="1.1s" repeatCount="indefinite" begin="1.3s"/>
    </rect>

    <text x="26" y="96" font-size="15" fill="#10b981" font-family="ui-monospace, Menlo, monospace" opacity="0">
      ✔ 20 suites · 567 tests · 0 failures
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
    </text>
    <text x="26" y="126" font-size="15" fill="#10b981" font-family="ui-monospace, Menlo, monospace" opacity="0">
      ✔ 23,000+ lines Solidity · zero dependencies
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.5s"/>
    </text>
    <text x="26" y="156" font-size="15" fill="#fcd34d" font-family="ui-monospace, Menlo, monospace" opacity="0">
      ✔ CI 20/20 green · 20 dApps live on Sepolia
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="3.2s"/>
    </text>
    <text x="26" y="186" font-size="15" fill="#8b96ab" font-family="ui-monospace, Menlo, monospace" opacity="0">
      ✔ invariants hold: x·y ≥ k · corpus intact · funds ring-fenced
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="3.9s"/>
    </text>
    <rect x="26" y="198" width="9" height="15" fill="#06b6d4" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.55;0.55;1" dur="1.1s" repeatCount="indefinite" begin="4.4s"/>
    </rect>
  </g>

  <!-- sweeping scan line -->
  <rect y="296" width="1200" height="2.5" fill="url(#g1)" opacity="0.55">
    <animate attributeName="y" values="296;0;296" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
