<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="glowT" cx="0.14" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.86" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#071210"/>
  <rect width="1200" height="300" fill="url(#glowT)"/>
  <rect width="1200" height="300" fill="url(#glowG)"/>

  <!-- swaying yield sparks -->
  <circle cx="140" cy="230" r="4" fill="#14b8a6" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="cy" values="230;40" dur="7s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="cx" values="140;158;140" dur="7s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="200" cy="250" r="3.5" fill="#facc15" opacity="0">
    <animate attributeName="opacity" values="0;0.85;0" dur="8s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" values="250;50" dur="8s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cx" values="200;184;200" dur="8s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="170" cy="260" r="3" fill="#14b8a6" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="6.4s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="cy" values="260;60" dur="6.4s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="cx" values="170;186;170" dur="6.4s" repeatCount="indefinite" begin="3s"/>
  </circle>

  <!-- identity -->
  <text x="240" y="112" font-size="42" font-weight="700" fill="url(#g1)" opacity="0">
    StakeVault
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="242" y="150" font-size="20" font-weight="600" fill="#e8f5ef" opacity="0">
    Time-weighted staking rewards — from scratch
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="242" y="178" font-size="13.5" fill="#90a89e" opacity="0">
    Stake STAKE · earn REWARD at a fixed global rate · fair by construction with per-user checkpoints
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- earnings panel with live ticker -->
  <g transform="translate(640 44)">
    <rect width="520" height="212" rx="16" fill="#0a1a16" stroke="#1e3a32" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.4s"/>
    </rect>
    <text x="24" y="36" font-size="12.5" fill="#90a89e" font-family="ui-monospace, Menlo, monospace" opacity="0">
      earned (live)
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.5s"/>
    </text>
    <text x="24" y="86" font-size="40" font-weight="700" fill="#facc15" font-family="ui-monospace, Menlo, monospace" opacity="0">
      123.4567 REWARD
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.6s"/>
      <animate attributeName="opacity" values="1;0.75;1" dur="2.2s" repeatCount="indefinite" begin="2s"/>
    </text>

    <!-- staked bar -->
    <rect x="24" y="116" width="380" height="12" rx="6" fill="#1e3a32" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.4s"/>
    </rect>
    <rect x="24" y="116" width="0" height="12" rx="6" fill="url(#g1)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" fill="freeze" begin="2.5s"/>
      <animate attributeName="width" from="0" to="247" dur="2.2s" fill="freeze" begin="2.5s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <text x="404" y="126" font-size="12" text-anchor="end" fill="#90a89e" font-family="ui-monospace, Menlo, monospace" opacity="0">
      your share 65%
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.6s"/>
    </text>

    <!-- claim button with growing glow -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="4.4s"/>
      <circle cx="70" cy="172" r="24" fill="none" stroke="#facc15" stroke-width="2" opacity="0.5">
        <animate attributeName="r" values="20;30" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <rect x="46" y="160" width="48" height="24" rx="12" fill="url(#g1)"/>
      <text x="70" y="176" font-size="11.5" font-weight="700" fill="#04211c" text-anchor="middle">Claim</text>
    </g>

    <!-- rate line -->
    <text x="130" y="176" font-size="12.5" fill="#5eead4" font-family="ui-monospace, Menlo, monospace" opacity="0">
      385,802 REWARD / day
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="4.6s"/>
    </text>
  </g>

  <!-- sweep line -->
  <rect y="296" width="1200" height="2.5" fill="url(#g1)" opacity="0.55">
    <animate attributeName="y" values="296;0;296" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
