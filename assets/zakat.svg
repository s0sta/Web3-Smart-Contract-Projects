<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a317"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- ivory (static) -->
  <rect width="1200" height="300" fill="#fdfaf2"/>
  <circle cx="140" cy="60" r="150" fill="#e8a317" opacity="0.09"/>
  <circle cx="1070" cy="250" r="160" fill="#4f46e5" opacity="0.07"/>

  <!-- identity -->
  <text x="60" y="112" font-size="40" font-weight="700" fill="#2a2416" opacity="0">
    Zakat Engine — Bayt al-Mal
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.3s"/>
  </text>
  <text x="62" y="150" font-size="19" font-weight="600" fill="#e8a317" opacity="0">
    2.5% · nisab &amp; hawl · the eight asnaf of Quran 9:60
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
  </text>
  <text x="62" y="178" font-size="13.5" fill="#9a8f74" opacity="0">
    ring-fenced fund · 2-of-3 committee · proof-hashed recipients
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1s"/>
  </text>

  <!-- eight gates panel -->
  <g transform="translate(700 40)">
    <rect width="460" height="220" rx="14" fill="#fffdf8" stroke="#e6dec8" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.4s"/>
    </rect>

    <text x="20" y="42" font-size="13.5" font-weight="700" fill="#2a2416" opacity="0">
      The eight gates — allocation
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    </text>
    <text x="20" y="62" font-size="11" fill="#9a8f74" opacity="0">
      Fuqara 40% · Masakin 40% · Amil 10% · Muallaf 10%
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.6s"/>
    </text>

    <!-- allocation bars -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="1.8s"/>
      <rect x="20" y="84" width="420" height="14" rx="7" fill="#f0ead9"/>
      <rect x="20" y="84" width="0" height="14" rx="7" fill="#e8a317">
        <animate attributeName="width" from="0" to="168" dur="1.4s" fill="freeze" begin="1.8s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
      <rect x="188" y="84" width="0" height="14" rx="7" fill="#4f46e5">
        <animate attributeName="width" from="0" to="168" dur="1.4s" fill="freeze" begin="2s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
      <rect x="356" y="84" width="0" height="14" rx="7" fill="#c9b06a">
        <animate attributeName="width" from="0" to="84" dur="1.4s" fill="freeze" begin="2.2s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>

    <rect x="20" y="120" width="420" height="34" rx="8" fill="#f0ead9" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.6s"/>
    </rect>
    <text x="34" y="141" font-size="11" fill="#2a2416" opacity="0">
      🧮 wealth 250,000 · nisab 4,000 · due 2.5% after hawl
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.7s"/>
    </text>

    <rect x="20" y="162" width="420" height="34" rx="8" fill="#f0ead9" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="2.9s"/>
    </rect>
    <text x="34" y="183" font-size="11" fill="#4f46e5" opacity="0">
      🤲 ring-fenced — the committee cannot divert the fund
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze" begin="3s"/>
    </text>
  </g>
</svg>
